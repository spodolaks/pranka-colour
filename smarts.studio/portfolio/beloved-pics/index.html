<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Beloved Pics - smarts.studio</title><meta name="description" content="One-hits. Final images. The ones we go through all the hustle for."><link rel="canonical" href="https://pranka.id.lv/smarts.studio/portfolio/beloved-pics/"><meta property="og:title" content="Beloved Pics - smarts.studio"><meta property="og:description" content="One-hits. Final images. The ones we go through all the hustle for."><meta property="og:image" content="https://pranka.id.lv/smarts.studio/img/t/4761.jpg"><link rel="icon" href="/smarts.studio/favicon.png" type="image/png"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&family=Unica+One&display=swap" rel="stylesheet"><link rel="stylesheet" href="/smarts.studio/site.css?v=3"></head> <body> <header class="top wrap"> <a class="logo" href="/smarts.studio/" aria-label="smarts.studio home"><img src="/smarts.studio/logo.png" width="987" height="196" alt="smArts studio"></a> <button class="burger" aria-label="Menu" aria-expanded="false" aria-controls="nav"><i></i><i></i></button> <nav id="nav"> <a href="/smarts.studio/">Home</a><a href="/smarts.studio/series/">Series</a><a href="/smarts.studio/collaboration-projects/">Collaboration projects</a><a href="/smarts.studio/specials/">Specials</a><a href="/smarts.studio/video/">Video</a><a href="/smarts.studio/portfolio/our-story/">Our Story</a><a href="/smarts.studio/contacts/">About Us</a> </nav> </header> <main class="wrap"> <div class="phead"> <div> <h1>Beloved Pics</h1> <p class="meta"><a href="/smarts.studio/">Home</a> / <a href="/smarts.studio/specials/">Specials</a> / Beloved Pics</p> </div> <div><p>One-hits. Final images. The ones we go through all the hustle for. </p></div> </div> <section class="mas"> <figure> <a href="/smarts.studio/img/4738.jpg" data-lb data-title="The other game"><img src="/smarts.studio/img/t/4738.jpg" srcset="/smarts.studio/img/t/4738.jpg 900w, /smarts.studio/img/4738.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="The other game" loading="eager"></a> <figcaption><h4>The other game</h4><p>You can&#39;t count on winning just by imposing your own rules on your opponent, if your opposition never have agreed to the suggested rules, and it is just you who is playing by them, it is a definite loss.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4743.jpg" data-lb data-title="System"><img src="/smarts.studio/img/t/4743.jpg" srcset="/smarts.studio/img/t/4743.jpg 900w, /smarts.studio/img/4743.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="System" loading="eager"></a> <figcaption><h4>System</h4><p>Blind, merciless, absolute.<br>People stay within the system even it is absurd and meaningless in the most extreme way possible. Often system places the border right next to the spot where host of opportunities can be seen, just one step away.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4744.jpg" data-lb data-title="Fisherman"><img src="/smarts.studio/img/t/4744.jpg" srcset="/smarts.studio/img/t/4744.jpg 900w, /smarts.studio/img/4744.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Fisherman" loading="lazy"></a> <figcaption><h4>Fisherman</h4><p>When it&#39;s time to move on and it&#39;s meaningless to stay, often we continue to hope against hope. These expectations can&#39;t be justified, as long as we&#39;re standing still and watching our fantasies, unable to move further.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4750.jpg" data-lb data-title="Lost"><img src="/smarts.studio/img/t/4750.jpg" srcset="/smarts.studio/img/t/4750.jpg 900w, /smarts.studio/img/4750.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Lost" loading="lazy"></a> <figcaption><h4>Lost</h4><p>When the world has fallen<br>and you are still holding to its ruined walls<br>and you are scared<br>and you are lost.<br><br>Just release.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4751.jpg" data-lb data-title="Sea Foam"><img src="/smarts.studio/img/t/4751.jpg" srcset="/smarts.studio/img/t/4751.jpg 900w, /smarts.studio/img/4751.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Sea Foam" loading="lazy"></a> <figcaption><h4>Sea Foam</h4><p>I have seafoam in my veins, I understand the language of waves.<br><br>© Jean Cocteau<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4747.jpg" data-lb data-title="Сome as you are"><img src="/smarts.studio/img/t/4747.jpg" srcset="/smarts.studio/img/t/4747.jpg 900w, /smarts.studio/img/4747.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Сome as you are" loading="lazy"></a> <figcaption><h4>Сome as you are</h4><p>Don&#39;t be shy, your true nature is always the most beautiful<br><br>This very sensitive portrait was taken during our trip to Berlin ;)<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4754.jpg" data-lb data-title="Ligo"><img src="/smarts.studio/img/t/4754.jpg" srcset="/smarts.studio/img/t/4754.jpg 900w, /smarts.studio/img/4754.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Ligo" loading="lazy"></a> <figcaption><h4>Ligo</h4><p>Searching for the fern, be careful, &#39;cause you may not like what you&#39;ll discover. Happy summer solstice!<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4736.jpg" data-lb data-title="Blind"><img src="/smarts.studio/img/t/4736.jpg" srcset="/smarts.studio/img/t/4736.jpg 900w, /smarts.studio/img/4736.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Blind" loading="lazy"></a> <figcaption><h4>Blind</h4><p>It doesn&#39;t really matter what surrounds you, if you can&#39;t see any of it. If you keep your eyes closed for just a bit too long, it might be too late to open them up already.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4755.jpg" data-lb data-title="Fallen sky"><img src="/smarts.studio/img/t/4755.jpg" srcset="/smarts.studio/img/t/4755.jpg 900w, /smarts.studio/img/4755.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3113" height="2000" alt="Fallen sky" loading="lazy"></a> <figcaption><h4>Fallen sky</h4><p>Thrilling moment of touching your wildest dreams, that unexpectedly came true.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4756.jpg" data-lb data-title="Fly away"><img src="/smarts.studio/img/t/4756.jpg" srcset="/smarts.studio/img/t/4756.jpg 900w, /smarts.studio/img/4756.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Fly away" loading="lazy"></a> <figcaption><h4>Fly away</h4><p>Sometimes it is nice to just give in, let the force pick you up and carry in its direction.<br>Leaves you with time to think and observe<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4739.jpg" data-lb data-title="Observing the force and the strength."><img src="/smarts.studio/img/t/4739.jpg" srcset="/smarts.studio/img/t/4739.jpg 900w, /smarts.studio/img/4739.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Observing the force and the strength." loading="lazy"></a> <figcaption><h4>Observing the force and the strength.</h4></figcaption> </figure><figure> <a href="/smarts.studio/img/4767.jpg" data-lb data-title="Anorexia dreams"><img src="/smarts.studio/img/t/4767.jpg" srcset="/smarts.studio/img/t/4767.jpg 900w, /smarts.studio/img/4767.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="5444" height="2000" alt="Anorexia dreams" loading="lazy"></a> <figcaption><h4>Anorexia dreams</h4><p>Every girl has an anorexia of some kind, you should closely look after yourself, not to fall beaten by it<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4740.jpg" data-lb data-title="Airfree"><img src="/smarts.studio/img/t/4740.jpg" srcset="/smarts.studio/img/t/4740.jpg 900w, /smarts.studio/img/4740.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Airfree" loading="lazy"></a> <figcaption><h4>Airfree</h4><p>Can you see<br>there is something<br>in the Sweden sea<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4741.jpg" data-lb data-title="Becoming a sunset"><img src="/smarts.studio/img/t/4741.jpg" srcset="/smarts.studio/img/t/4741.jpg 900w, /smarts.studio/img/4741.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Becoming a sunset" loading="lazy"></a> <figcaption><h4>Becoming a sunset</h4><p>If you believe and trying hard enough, wings of your dream make everything possible<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4753.jpg" data-lb data-title="Emptiness"><img src="/smarts.studio/img/t/4753.jpg" srcset="/smarts.studio/img/t/4753.jpg 900w, /smarts.studio/img/4753.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Emptiness" loading="lazy"></a> <figcaption><h4>Emptiness</h4><p>Sometimes it feels like you are really dead empty inside, because someone just hurt you one step to far. Brace yourself, keep your inner self<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4746.jpg" data-lb data-title="Road fork"><img src="/smarts.studio/img/t/4746.jpg" srcset="/smarts.studio/img/t/4746.jpg 900w, /smarts.studio/img/4746.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Road fork" loading="lazy"></a> <figcaption><h4>Road fork</h4><p>Often what is white and tidy on the outside is completely black inside. And when it gets to choose, there are no options in reality.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4776.jpg" data-lb data-title="Totem"><img src="/smarts.studio/img/t/4776.jpg" srcset="/smarts.studio/img/t/4776.jpg 900w, /smarts.studio/img/4776.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Totem" loading="lazy"></a> <figcaption><h4>Totem</h4><p>Sometimes it takes a mask, to express what is on the inside.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4763.jpg" data-lb data-title="Oak girl"><img src="/smarts.studio/img/t/4763.jpg" srcset="/smarts.studio/img/t/4763.jpg 900w, /smarts.studio/img/4763.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2956" height="2000" alt="Oak girl" loading="lazy"></a> <figcaption><h4>Oak girl</h4><p>Every once in awhile try to be in the moment, to be present and conscious of your surroundings, feel the whisper inside and submerge into the world around you. Carpe diem.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4764.jpg" data-lb data-title="Happy Easter!"><img src="/smarts.studio/img/t/4764.jpg" srcset="/smarts.studio/img/t/4764.jpg 900w, /smarts.studio/img/4764.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2935" height="2000" alt="Happy Easter!" loading="lazy"></a> <figcaption><h4>Happy Easter!</h4><p>Sometimes you have to brake an egg to make a photo :)<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4737.jpg" data-lb data-title="Sleeping Beauty"><img src="/smarts.studio/img/t/4737.jpg" srcset="/smarts.studio/img/t/4737.jpg 900w, /smarts.studio/img/4737.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Sleeping Beauty" loading="lazy"></a> <figcaption><h4>Sleeping Beauty</h4><p>When you choose a weapon against your enemy, make sure it&#39;s not her passion.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4765.jpg" data-lb data-title="Bulletproof"><img src="/smarts.studio/img/t/4765.jpg" srcset="/smarts.studio/img/t/4765.jpg 900w, /smarts.studio/img/4765.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Bulletproof" loading="lazy"></a> <figcaption><h4>Bulletproof</h4><p>Sometimes it is important to find a balance, to let your inner power out, despite what happens in the outer world.<br><br>Freeze the moment, take as long as necessary to evaluate surroundings, then react!<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4768.jpg" data-lb data-title="Birds"><img src="/smarts.studio/img/t/4768.jpg" srcset="/smarts.studio/img/t/4768.jpg 900w, /smarts.studio/img/4768.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Birds" loading="lazy"></a> <figcaption><h4>Birds</h4><p>Once you let yourself dream, your dreams may actually come true.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4748.jpg" data-lb data-title="Plastic"><img src="/smarts.studio/img/t/4748.jpg" srcset="/smarts.studio/img/t/4748.jpg 900w, /smarts.studio/img/4748.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Plastic" loading="lazy"></a> <figcaption><h4>Plastic</h4><p>When you are trying to merge with surroundings, but all your attempts are faked and plastic, even something different, exclusive and alive in your hands won&#39;t resist or survive<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4758.jpg" data-lb data-title="The Wall"><img src="/smarts.studio/img/t/4758.jpg" srcset="/smarts.studio/img/t/4758.jpg 900w, /smarts.studio/img/4758.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="The Wall" loading="lazy"></a> <figcaption><h4>The Wall</h4><p>You can be brave and bold, when there is The Wall behind you, when there is something to rely on<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4749.jpg" data-lb data-title="Step to the nowhere"><img src="/smarts.studio/img/t/4749.jpg" srcset="/smarts.studio/img/t/4749.jpg 900w, /smarts.studio/img/4749.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Step to the nowhere" loading="lazy"></a> <figcaption><h4>Step to the nowhere</h4><p>Living with your eyes wide shut, eventually you will run out of path to follow, though unable to see it, you will make the step<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4807.jpg" data-lb data-title="Bright Lights"><img src="/smarts.studio/img/t/4807.jpg" srcset="/smarts.studio/img/t/4807.jpg 900w, /smarts.studio/img/4807.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2244" height="2000" alt="Bright Lights" loading="lazy"></a> <figcaption><h4>Bright Lights</h4><p>If you&#39;ll look up from time to time, instead of staring at your feet, it can bring you some unforgettable experience :)<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4777.jpg" data-lb data-title="Tweens in betweens"><img src="/smarts.studio/img/t/4777.jpg" srcset="/smarts.studio/img/t/4777.jpg 900w, /smarts.studio/img/4777.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="4733" height="2000" alt="Tweens in betweens" loading="lazy"></a> <figcaption><h4>Tweens in betweens</h4></figcaption> </figure><figure> <a href="/smarts.studio/img/4745.jpg" data-lb data-title="Standing in line"><img src="/smarts.studio/img/t/4745.jpg" srcset="/smarts.studio/img/t/4745.jpg 900w, /smarts.studio/img/4745.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2894" height="2000" alt="Standing in line" loading="lazy"></a> <figcaption><h4>Standing in line</h4><p>Standing, waiting and starring. Everything around you just fades away, only last line of defense remains, but it won&#39;t hold its own for long. In the end only you against the wild force, one on one, face to face.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4772.jpg" data-lb data-title="Denial"><img src="/smarts.studio/img/t/4772.jpg" srcset="/smarts.studio/img/t/4772.jpg 900w, /smarts.studio/img/4772.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2981" height="2000" alt="Denial" loading="lazy"></a> <figcaption><h4>Denial</h4><p>First you note it, then you&#39;re trying to connive at it and when it&#39;s too difficult you just turn yourself back.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4757.jpg" data-lb data-title="Under the hood"><img src="/smarts.studio/img/t/4757.jpg" srcset="/smarts.studio/img/t/4757.jpg 900w, /smarts.studio/img/4757.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Under the hood" loading="lazy"></a> <figcaption><h4>Under the hood</h4></figcaption> </figure><figure> <a href="/smarts.studio/img/4752.jpg" data-lb data-title="The Rise"><img src="/smarts.studio/img/t/4752.jpg" srcset="/smarts.studio/img/t/4752.jpg 900w, /smarts.studio/img/4752.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="The Rise" loading="lazy"></a> <figcaption><h4>The Rise</h4><p>Once there was only dark, and it will all return to darkness one day.<br>Each of us is on his own battle keeping the light within him bright. Some days it requires all of your strenght just to keep the darkness<br>that lies within you away.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4770.jpg" data-lb data-title="Get disconnected"><img src="/smarts.studio/img/t/4770.jpg" srcset="/smarts.studio/img/t/4770.jpg 900w, /smarts.studio/img/4770.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Get disconnected" loading="lazy"></a> <figcaption><h4>Get disconnected</h4><p>Gadgets are awesome, but if you&#39;ll turn them off just for an hour, you&#39;ll see a colorful bright world around you<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4775.jpg" data-lb data-title="Not so easy to wake up a supergirl"><img src="/smarts.studio/img/t/4775.jpg" srcset="/smarts.studio/img/t/4775.jpg 900w, /smarts.studio/img/4775.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Not so easy to wake up a supergirl" loading="lazy"></a> <figcaption><h4>Not so easy to wake up a supergirl</h4></figcaption> </figure><figure> <a href="/smarts.studio/img/4762.jpg" data-lb data-title="Moments of choice"><img src="/smarts.studio/img/t/4762.jpg" srcset="/smarts.studio/img/t/4762.jpg 900w, /smarts.studio/img/4762.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2938" height="2000" alt="Moments of choice" loading="lazy"></a> <figcaption><h4>Moments of choice</h4><p>You were left behind before, and people still might leave you in the darkest of moments. Those moments are the best time to think through you next step.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4759.jpg" data-lb data-title="Triangles"><img src="/smarts.studio/img/t/4759.jpg" srcset="/smarts.studio/img/t/4759.jpg 900w, /smarts.studio/img/4759.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Triangles" loading="lazy"></a> <figcaption><h4>Triangles</h4><p>The most important is to find where you fit in. When it&#39;s done all you need is to accumulate and transform<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4773.jpg" data-lb data-title="Hunter. Redemption."><img src="/smarts.studio/img/t/4773.jpg" srcset="/smarts.studio/img/t/4773.jpg 900w, /smarts.studio/img/4773.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3576" height="2000" alt="Hunter. Redemption." loading="lazy"></a> <figcaption><h4>Hunter. Redemption.</h4></figcaption> </figure><figure> <a href="/smarts.studio/img/4771.jpg" data-lb data-title="First Day of September"><img src="/smarts.studio/img/t/4771.jpg" srcset="/smarts.studio/img/t/4771.jpg 900w, /smarts.studio/img/4771.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2604" height="2000" alt="First Day of September" loading="lazy"></a> <figcaption><h4>First Day of September</h4><p>Not all knowledges are similar. And for some of them, there is different way to study.<br>Happy first school day for all who involved! Be laborious, but still naughty :)<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4760.jpg" data-lb data-title="New Year. Happy for someone, not so much for others"><img src="/smarts.studio/img/t/4760.jpg" srcset="/smarts.studio/img/t/4760.jpg 900w, /smarts.studio/img/4760.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3001" height="2000" alt="New Year. Happy for someone, not so much for others" loading="lazy"></a> <figcaption><h4>New Year. Happy for someone, not so much for others</h4></figcaption> </figure><figure> <a href="/smarts.studio/img/4769.jpg" data-lb data-title="Circle of life"><img src="/smarts.studio/img/t/4769.jpg" srcset="/smarts.studio/img/t/4769.jpg 900w, /smarts.studio/img/4769.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2744" height="2000" alt="Circle of life" loading="lazy"></a> <figcaption><h4>Circle of life</h4><p>The beginning and the end, circle of life may happen in one moment or last for years. Seize the day, cause you don&#39;t know when your term expires.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4761.jpg" data-lb data-title="Lost"><img src="/smarts.studio/img/t/4761.jpg" srcset="/smarts.studio/img/t/4761.jpg 900w, /smarts.studio/img/4761.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3000" height="2000" alt="Lost" loading="lazy"></a> <figcaption><h4>Lost</h4><p>...so small, so pure. In the hidden river of the stream of life<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4766.jpg" data-lb data-title="Face your Fears"><img src="/smarts.studio/img/t/4766.jpg" srcset="/smarts.studio/img/t/4766.jpg 900w, /smarts.studio/img/4766.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="3072" height="2000" alt="Face your Fears" loading="lazy"></a> <figcaption><h4>Face your Fears</h4><p>We want to turn our back to the fears we face and run. But you can&#39;t outrun your fears, you can&#39;t hide from them, the only way of overcoming fear is standing up against them!<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4778.jpg" data-lb data-title="Happy New Year Everyone!"><img src="/smarts.studio/img/t/4778.jpg" srcset="/smarts.studio/img/t/4778.jpg 900w, /smarts.studio/img/4778.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2973" height="2000" alt="Happy New Year Everyone!" loading="lazy"></a> <figcaption><h4>Happy New Year Everyone!</h4><p>Especially those who are within the bounds of traditions, rules and superstitions. Have the courage for passion, growth and keep on trying to follow your dreams.<br></p></figcaption> </figure><figure> <a href="/smarts.studio/img/4966.jpg" data-lb data-title="Bunker.lv - Post-apocalypse discussion game"><img src="/smarts.studio/img/t/4966.jpg" srcset="/smarts.studio/img/t/4966.jpg 900w, /smarts.studio/img/4966.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="4457" height="1791" alt="Bunker.lv - Post-apocalypse discussion game" loading="lazy"></a> <figcaption><h4>Bunker.lv - Post-apocalypse discussion game</h4></figcaption> </figure><figure> <a href="/smarts.studio/img/4965.jpg" data-lb data-title="Bunker.lv - Post-apocalypse discussion game"><img src="/smarts.studio/img/t/4965.jpg" srcset="/smarts.studio/img/t/4965.jpg 900w, /smarts.studio/img/4965.jpg 2200w" sizes="(max-width:700px) 100vw, 560px" width="2500" height="1667" alt="Bunker.lv - Post-apocalypse discussion game" loading="lazy"></a> <figcaption><h4>Bunker.lv - Post-apocalypse discussion game</h4></figcaption> </figure> </section><nav class="pnav"> <span><a href="/smarts.studio/portfolio/slokas-animal-shelter/">&larr; Slokas Animal Shelter</a></span> <span><a href="/smarts.studio/portfolio/maggie-friends/">Maggie &amp; Friends &rarr;</a></span> </nav> <script src="/smarts.studio/lightbox.js?v=3" defer></script> <script src="/smarts.studio/gallery.js?v=3" defer></script> </main> <footer class="wrap foot"> <span>&copy; 2026 smArts.studio, with love</span> <span><a href="
